apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-web-account-service-config
data:
  PORT: "3000"
  NODE_ENV: "production"
  NACOS_SERVER: "host.docker.internal:8848"
  NACOS_NAMESPACE: "public"
  NACOS_GROUP: "DEFAULT_GROUP"
  NACOS_SERVICE_NAME: "chat-web-account-service"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-web-account-service
  labels:
    app: chat-web-account-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-web-account-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: chat-web-account-service
    spec:
      containers:
        - name: app
          image: chat-web-account-service:latest
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: chat-web-account-service-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: chat-web-account-service
  labels:
    app: chat-web-account-service
spec:
  type: LoadBalancer
  selector:
    app: chat-web-account-service
  ports:
    - name: http
      port: 3000
      targetPort: 3000
