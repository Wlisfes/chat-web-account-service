name: chat-web-account-service

services:
  account-service:
    image: ${IMAGE:?IMAGE is required}
    container_name: chat-web-account-service
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - infrastructure
    stop_grace_period: 20s

networks:
  infrastructure:
    external: true
    name: ${DOCKER_NETWORK:-chat-web-infrastructure}
