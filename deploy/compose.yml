name: chat-web-service

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  account-service:
    image: ${IMAGE:?IMAGE is required}
    container_name: chat-web-account-service
    restart: unless-stopped
    logging: *default-logging
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_HOST: ${REDIS_HOST:-chat-web-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - infrastructure
    stop_grace_period: 20s

networks:
  infrastructure:
    external: true
    name: ${DOCKER_NETWORK:-chat-web-infrastructure}
