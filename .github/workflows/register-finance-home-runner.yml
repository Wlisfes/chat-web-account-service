name: Register Finance Home runner

on:
    workflow_dispatch:

jobs:
    register:
        name: Register repository runner
        runs-on:
            - self-hosted
            - linux
            - chat-server-home
        permissions:
            contents: read

        env:
            FINANCE_RUNNER_IMAGE: ghcr.io/actions/actions-runner:latest
            FINANCE_RUNNER_CONTAINER: chat-web-finance-runner-home
            FINANCE_RUNNER_VOLUME: chat-web-finance-runner-home
            FINANCE_DEPLOY_VOLUME: chat-web-finance-deploy-home

        steps:
            - name: Prepare Finance runner runtime
              shell: bash
              env:
                  RUNNER_REGISTRATION_TOKEN: ${{ secrets.FINANCE_RUNNER_REGISTRATION_TOKEN }}
              run: |
                  set -eu
                  token_file="$RUNNER_TEMP/finance-runner-token"
                  runner_uid=$(id -u)
                  runner_gid=$(id -g)

                  http_proxy_value=${HTTP_PROXY:-${http_proxy:-}}
                  https_proxy_value=${HTTPS_PROXY:-${https_proxy:-}}
                  http_proxy_value=${http_proxy_value//127.0.0.1/host.docker.internal}
                  https_proxy_value=${https_proxy_value//127.0.0.1/host.docker.internal}

                  umask 077
                  printf '%s' "$RUNNER_REGISTRATION_TOKEN" > "$token_file"
                  trap 'rm -f "$token_file"' EXIT

                  docker pull "$FINANCE_RUNNER_IMAGE"
                  docker volume create "$FINANCE_RUNNER_VOLUME" >/dev/null
                  docker volume create "$FINANCE_DEPLOY_VOLUME" >/dev/null
                  docker run --rm \
                    --user root \
                    --add-host host.docker.internal:host-gateway \
                    --env RUNNER_ALLOW_RUNASROOT=1 \
                    --env HOST_RUNNER_UID="$runner_uid" \
                    --env HOST_RUNNER_GID="$runner_gid" \
                    --env HTTP_PROXY="$http_proxy_value" \
                    --env HTTPS_PROXY="$https_proxy_value" \
                    --volume "$FINANCE_RUNNER_VOLUME:/runner-config" \
                    --volume "$FINANCE_DEPLOY_VOLUME:/deploy-target" \
                    --volume "$token_file:/run/runner-token:ro" \
                    "$FINANCE_RUNNER_IMAGE" \
                    bash -lc '
                      set -eu
                      if [ ! -x /runner-config/config.sh ]; then
                        cp -a /home/runner/. /runner-config/
                      fi
                      cd /runner-config
                      if [ ! -f .runner ]; then
                        test -s /run/runner-token || { echo "Missing FINANCE_RUNNER_REGISTRATION_TOKEN" >&2; exit 1; }
                        ./config.sh \
                          --unattended \
                          --url https://github.com/Wlisfes/chat-web-finance-service \
                          --token "$(cat /run/runner-token)" \
                          --name chat-server-home-finance \
                          --labels chat-server-home \
                          --work _work \
                          --replace
                      fi
                      install -d -m 0755 .docker/cli-plugins
                      if [ ! -x .docker/cli-plugins/docker-compose ]; then
                        curl -fsSL https://github.com/docker/compose/releases/download/v2.39.2/docker-compose-linux-x86_64 \
                          -o .docker/cli-plugins/docker-compose
                        chmod 0755 .docker/cli-plugins/docker-compose
                      fi
                      chown -R "$HOST_RUNNER_UID:$HOST_RUNNER_GID" /runner-config
                      chmod 0755 /deploy-target
                      chown -R "$HOST_RUNNER_UID:$HOST_RUNNER_GID" /deploy-target
                    '

            - name: Synchronize shared runtime settings
              shell: bash
              run: |
                  set -eu
                  runner_uid=$(id -u)
                  runner_gid=$(id -g)
                  awk -F= '
                    BEGIN {
                      split("JWT_SECRET REDIS_URL REDIS_HOST REDIS_PORT REDIS_DATABASE REDIS_USERNAME REDIS_PASSWORD REDIS_TLS NACOS_SERVER NACOS_NAMESPACE NACOS_CONFIG_GROUP NACOS_USERNAME NACOS_PASSWORD", names, " ")
                      for (i in names) allowed[names[i]] = 1
                    }
                    allowed[$1] { print }
                  ' /opt/chat-web-account-service/.env |
                    docker run --rm -i \
                      --user "$runner_uid:$runner_gid" \
                      --volume "$FINANCE_RUNNER_VOLUME:/home/runner" \
                      --workdir /home/runner \
                      "$FINANCE_RUNNER_IMAGE" \
                      bash -c 'umask 077; cat > account.env'

            - name: Start Finance repository runner
              shell: bash
              run: |
                  set -eu
                  socket_group=$(stat -c '%g' /var/run/docker.sock)
                  runner_uid=$(id -u)
                  runner_gid=$(id -g)
                  http_proxy_value=${HTTP_PROXY:-${http_proxy:-}}
                  https_proxy_value=${HTTPS_PROXY:-${https_proxy:-}}
                  http_proxy_value=${http_proxy_value//127.0.0.1/host.docker.internal}
                  https_proxy_value=${https_proxy_value//127.0.0.1/host.docker.internal}

                  current_state=$(docker inspect "$FINANCE_RUNNER_CONTAINER" --format '{{.State.Status}}' 2>/dev/null || true)
                  if [ "$current_state" = running ]; then
                    echo "Finance repository runner container is already running"
                    exit 0
                  fi

                  docker rm -f "$FINANCE_RUNNER_CONTAINER" >/dev/null 2>&1 || true
                  docker run -d \
                    --name "$FINANCE_RUNNER_CONTAINER" \
                    --restart unless-stopped \
                    --user "$runner_uid:$runner_gid" \
                    --group-add "$socket_group" \
                    --add-host host.docker.internal:host-gateway \
                    --env RUNNER_ALLOW_RUNASROOT=1 \
                    --env HTTP_PROXY="$http_proxy_value" \
                    --env HTTPS_PROXY="$https_proxy_value" \
                    --volume "$FINANCE_RUNNER_VOLUME:/home/runner" \
                    --volume "$FINANCE_DEPLOY_VOLUME:/opt/chat-web-finance-service" \
                    --volume /var/run/docker.sock:/var/run/docker.sock \
                    --workdir /home/runner \
                    "$FINANCE_RUNNER_IMAGE" \
                    bash -c 'exec ./run.sh'

            - name: Verify Finance repository runner
              shell: bash
              run: |
                  set -eu
                  elapsed=0
                  until docker logs "$FINANCE_RUNNER_CONTAINER" 2>&1 | grep -q 'Listening for Jobs'; do
                    state=$(docker inspect "$FINANCE_RUNNER_CONTAINER" --format '{{.State.Status}}' 2>/dev/null || true)
                    case "$state" in
                      exited|dead)
                        docker logs "$FINANCE_RUNNER_CONTAINER" 2>&1 || true
                        exit 1
                        ;;
                    esac
                    test "$elapsed" -lt 120 || { docker logs "$FINANCE_RUNNER_CONTAINER" 2>&1 || true; exit 1; }
                    sleep 3
                    elapsed=$((elapsed + 3))
                  done
                  docker inspect "$FINANCE_RUNNER_CONTAINER" --format '{{.Name}} {{.State.Status}}'
